<!DOCTYPE html>
<html>
<head>
    <title>Road Damage Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="leaflet/leaflet.css" />
    <script src="leaflet/leaflet.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #f1f3f5;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .offline-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            color: #495057;
            border: 1px solid #ced4da;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="statusBadge" class="offline-badge">Offline Ready / Local Grid</div>
    <script>
        var map = L.map('map', {
            zoomControl: true,
            minZoom: 2,
            maxZoom: 19
        }).setView([12.9716, 77.5946], 15);

        // Safe SVG placeholder tile for offline mode
        var offlineTileSvg = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect width="256" height="256" fill="%23f8f9fa"/><rect x="0" y="0" width="256" height="256" fill="none" stroke="%23dee2e6" stroke-width="1"/></svg>';

        // Standard OSM tile layer with offline fallback
        var tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap',
            errorTileUrl: offlineTileSvg
        });
        tileLayer.addTo(map);

        tileLayer.on('tileerror', function() {
            var badge = document.getElementById('statusBadge');
            if (badge) {
                badge.innerText = 'Offline Mode (Local Grid Active)';
            }
        });

        var markers = L.layerGroup().addTo(map);
        var pathLine = L.polyline([], {color: '#1971c2', weight: 4, opacity: 0.8}).addTo(map);

        // Called from Java to add defects
        function addDefect(id, lat, lon, severity) {
            var color = severity === 'High' ? '#e03131' : (severity === 'Medium' ? '#f08c00' : '#ffd43b');
            var marker = L.circleMarker([lat, lon], {
                radius: 9,
                fillColor: color,
                color: '#212529',
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.85
            });
            marker.bindPopup("<b>Defect #" + id + "</b><br>Severity: " + severity + "<br>Lat: " + lat.toFixed(4) + "<br>Lon: " + lon.toFixed(4));
            marker.on('click', function() {
                if (window.javaApp) {
                    window.javaApp.selectDefect(id);
                }
            });
            markers.addLayer(marker);
        }

        function clearMap() {
            markers.clearLayers();
            pathLine.setLatLngs([]);
        }

        function setView(lat, lon, zoom) {
            map.setView([lat, lon], zoom || 15);
        }
    </script>
</body>
</html>
