[project]
name = "road-damage-system"
version = "0.1.0"
description = "Multi-Stage Road Damage Detection & Repair-Decision System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "ultralytics>=8.4.123",
    "onnxruntime>=1.24.3",
    "torchvision>=0.29.1",
    "torch>=2.14.1",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
]
phash = [
    "imagehash>=4.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"training/03_convert_split.py" = ["N999"]
"ai-service/app/api/routes.py" = ["B008"]
"ai-service/app/api/deps.py" = ["B008"]


[tool.pytest.ini_options]
testpaths = ["ai-service/tests", "tests"]
pythonpath = ["ai-service", "training", "scripts", "."]

