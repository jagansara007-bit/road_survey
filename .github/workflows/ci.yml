name: CI Quality Gate

on:
  push:
    branches: [ "main", "phase/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Linting
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest ai-service/tests
